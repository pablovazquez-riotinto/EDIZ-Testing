name: main

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env
        with:
          artifactory-username: ${{ secrets.GHA_ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.GHA_ARTIFACTORY_PASSWORD }}
          extras: check

      - name: Run check target
        run: make check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env
        with:
          artifactory-username: ${{ secrets.GHA_ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.GHA_ARTIFACTORY_PASSWORD }}
          extras: test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: dockerhub.artifactory.riotinto.com
          username: ${{ secrets.GHA_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.GHA_ARTIFACTORY_PASSWORD }}

      - name: Run test target
        run: make test

      - name: "Upload coverage data"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage.*
          if-no-files-found: ignore
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env
        with:
          artifactory-username: ${{ secrets.GHA_ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.GHA_ARTIFACTORY_PASSWORD }}
          extras: test

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data
          merge-multiple: true

      - name: Run coverage target
        run: make coverage

      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-uv-env
        with:
          artifactory-username: ${{ secrets.GHA_ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.GHA_ARTIFACTORY_PASSWORD }}
          extras: docs

      - name: Run docs target
        run: make docs
