pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.10'

stages:
  - stage: Test
    jobs:
      - job: Check
        steps:
          - template: ./templates/setup-poetry-env.yaml
            parameters:
              poetryOptions: --only check
              pythonVersion: $(pythonVersion)

          - script: make check
            displayName: 'Run check target'

      - job: Test
        steps:
          - template: ./templates/setup-poetry-env.yaml
            parameters:
              pythonVersion: $(pythonVersion)

          - script: make test
            displayName: 'Run test target'
